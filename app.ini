[uwsgi]
wsgi-file = run.py
callable = application
socket = :8081
http-socket = :8082      # <-- HTTP для healthcheck
#processes = 4
#threads = 2
master = true
chmod-socket = 660
vacuum = true
die-on-term = true

#для поддержки WebSocket
gevent = 1000
async = 1000
http-websockets = true
gevent-early-monkey-patch = true

#Настройки
buffer-size = 32768
max-requests = 1000
reload-on-rss = 512
worker-reload-mercy = 60
